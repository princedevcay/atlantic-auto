# Production deploy over FTPS (GATE-003, CTL-DEP-001). Runs only from main, through the
# `production` environment, which requires the owner's approval. The baseline check fails closed
# unless the approved design digest (stored as an environment variable the owner controls) matches
# and the PULL_REQUEST and PRE_DEPLOY gates have PASSED evidence.
# Rollback: run this workflow manually with the previous good commit SHA.
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: Commit SHA to deploy (for rollback). Leave empty for the latest main.
        required: false

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.2'
          tools: composer:v2
          coverage: none
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - run: composer install --no-dev --no-interaction --no-progress --optimize-autoloader
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Assemble the deploy bundle (only what the server needs)
        run: |
          mkdir dist
          cp -R app bin database public vendor composer.json dist/
          rm -f dist/public/.app-root
          tar -czf bundle.tar.gz -C dist .
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: bundle.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bundle
          path: bundle.tar.gz
          retention-days: 90

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - name: Baseline approval and gate evidence (fails closed)
        env:
          BASELINE_DIGEST: ${{ vars.BASELINE_DIGEST }}
        run: |
          test -n "$BASELINE_DIGEST" || { echo "BASELINE_DIGEST is not set on the production environment"; exit 1; }
          python3 -m pip install --quiet pyyaml==6.0.3
          python3 .opskeep/elliot/scripts/validate_baseline.py security-baseline.yaml \
            --require-approved --expected-digest "$BASELINE_DIGEST" --target production --stage PRE_DEPLOY
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bundle
      - name: Unpack
        run: mkdir dist && tar -xzf bundle.tar.gz -C dist
      - name: Upload over FTPS (never touches config, uploads or backups)
        uses: SamKirkland/FTP-Deploy-Action@3a9c65ae0fc12ac924ccef8afc26941cc43aad0b # v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./dist/
          server-dir: ./
          dangerous-clean-slate: false
          log-level: minimal
