changes:
  - id: "CHG-001"
    type: "MODIFIED"
    status: "PROPOSED"
    material: true
    security_impact: "LOW"
    targets: ["CTL-SC-001", "GATE-002", "THR-009"]
    summary: "Allow a time-limited npm audit exception for GHSA-fc5q-39xc-vjpf (picomatch ReDoS)"
    old_rule: "npm audit fails the build on any HIGH or CRITICAL advisory"
    new_rule: "Same, except owner-approved exceptions in .github/audit-exceptions.json, each for one advisory, ending on its expiry date or when the package publishes a newer release"
    reason: "Advisory published 2026-10-19 affects every picomatch release (no fix). It reaches only the build chain through @tailwindcss/cli and @parcel/watcher; nothing from npm is deployed, watch mode is not used and the glob patterns are our own"
    compensating_controls: "Exception expires 2026-12-02 (14-day remediation SLA); expires early when picomatch publishes a release newer than 4.0.7; any other HIGH or CRITICAL advisory still fails CI; Dependabot security updates are not delayed by the cooldown"
    requested_by: "owner (chat, 18 Nov 2026: Allow the exception)"
    proposed_at: "2026-11-18"
  - id: "CHG-002"
    type: "ADDED"
    status: "PROPOSED"
    material: true
    security_impact: "MEDIUM"
    targets: ["AST-008", "FLW-007", "FLW-008", "THR-016", "CTL-AUTHZ-003", "CTL-FILE-001", "ID-001", "ID-002", "ID-003", "GATE-002"]
    summary: "Add cars for sale: public listings with prices and photos, featured cars on the home page, car enquiries, and staff car management with publish or hide"
    old_rule: "No public catalogue; all uploaded photos are private"
    new_rule: "Published car listings and their photos are public; hidden ones are not; staff manage listings, Admins delete them"
    reason: "Owner and client, 18 Nov 2026: selling cars is one of the three main things the business does; listings need amounts, available or sold status, and a hide option in the admin"
    compensating_controls: "CTL-AUTHZ-003 (published-only access, random references, staff-only changes, audit log), CTL-FILE-001 (upload checks, access-checked handler), the existing form abuse limits (CTL-API-001) for car enquiries"
    requested_by: "owner (chat, 18 Nov 2026)"
    proposed_at: "2026-11-18"
  - id: "CHG-003"
    type: "MODIFIED"
    status: "PROPOSED"
    material: true
    security_impact: "LOW"
    targets: ["GATE-003", "GATE-004", "GATE-005", "EVD-005", "EVD-006"]
    summary: "Launch openly: run the live-server checks in a new post-deploy gate instead of before the first deploy"
    old_rule: "All of the pre-launch review, including checks that need the live server, passes before the first production deploy"
    new_rule: "The local pre-launch review (GATE-004) passes before deploy; the live checks (HTTPS, headers and cookies, FTP and database scoping, cron and backup restore on the host, mail over TLS, privacy notice and contact details) run in GATE-005 within 48 hours of the first public deploy"
    reason: "Owner, 18 Nov 2026: no password-protected or private first deploy for a business site like this; the live checks can only run once the site is on the server"
    compensating_controls: "HSTS stays off until GATE-005 confirms HTTPS; sample cars carry a Sample badge and take no enquiries; the admin keeps password plus TOTP and lockout; code-level controls were verified locally (EVD-004); a GATE-005 failure is fixed or the site is taken offline by the developer"
    requested_by: "owner (chat, 18 Nov 2026)"
    proposed_at: "2026-11-18"
