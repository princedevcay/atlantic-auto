decisions:
  - id: "DEC-001"
    question: "Do staff accounts require MFA?"
    owner: "developer (PrinceCaleb.dev)"
    required_decision: "Yes: TOTP (authenticator app) required for every staff account"
    blocks_approval: false
    status: "DECIDED"
  - id: "DEC-002"
    question: "How do customers reach their tracking page?"
    owner: "developer (PrinceCaleb.dev)"
    required_decision: "Private link token, or reference plus last 4 phone digits; no accounts; never VIN alone"
    blocks_approval: false
    status: "DECIDED"
  - id: "DEC-003"
    question: "Which spam protection on the forms?"
    owner: "developer (PrinceCaleb.dev)"
    required_decision: "Honeypot, minimum fill time and rate limits first; a third-party CAPTCHA only through a change record"
    blocks_approval: false
    status: "DECIDED"
  - id: "DEC-004"
    question: "How long are enquiries, shipments and tracking links kept?"
    owner: "client owner (Atlantic Auto)"
    required_decision: "Proposed: enquiries 12 months after last activity; tracking link disabled 90 days after Delivered; shipment records kept for the business's record-keeping period. Client to confirm before launch"
    blocks_approval: false
    status: "OPEN"
  - id: "DEC-005"
    question: "Which carrier or container-tracking API, and on what terms?"
    owner: "developer (PrinceCaleb.dev)"
    required_decision: "Chosen after the client names its shipping lines and the providers' coverage and pricing are looked up. Adding the provider is recorded as a change (CHG) before the integration is built"
    blocks_approval: false
    status: "DEFERRED"
  - id: "DEC-006"
    question: "How is the code laid out on cPanel?"
    owner: "developer (PrinceCaleb.dev)"
    required_decision: "App deployed to a folder outside public_html; the domain's document root points at its public/ folder (or public_html holds only the public/ files and a front controller that loads the app from outside)"
    blocks_approval: false
    status: "DECIDED"
  - id: "DEC-007"
    question: "Where does the weekly off-host backup go?"
    owner: "developer (PrinceCaleb.dev)"
    required_decision: "Destination and encryption for the weekly copy (for example an encrypted archive pulled to the developer's storage). Needed before launch"
    blocks_approval: false
    status: "OPEN"
  - id: "DEC-008"
    question: "Does Act 843 registration and a privacy notice apply, and who is the data controller contact?"
    owner: "client owner (Atlantic Auto)"
    required_decision: "Client confirms before launch; the privacy page names the contact"
    blocks_approval: false
    status: "OPEN"
