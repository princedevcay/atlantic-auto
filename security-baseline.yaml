project:
  id: "PRJ-ATLANTIC-AUTO-001"
  name: "Atlantic Auto and Shipping Services website"
  purpose: "Public website for a Ghanaian USA vehicle importer and seller: cars for sale with enquiries, import quote and vehicle update requests, team tracking of shipments in a staff admin (customer tracking pages built but switched off), and a carrier API. PHP and MySQL on Namecheap cPanel shared hosting, deployed from a public GitHub repo by GitHub Actions over FTPS."
  owner: "developer (PrinceCaleb.dev)"
  intake:
    constraint:
      statement: "Prospects cannot start a USA import quote online, and existing customers have no clear way to ask where their vehicle is, so both land as ad hoc calls and WhatsApp messages that are slow to answer and easy to lose."
      evidence: "Owner's description of current enquiries (project gate assumption AS-07); no measured figures yet."
    forces:
      push: "Importing a car from the USA feels opaque: unclear steps, costs and where the car is right now."
      pull: "A quick import quote request and a simple way to ask for a vehicle update."
      anxiety: "Trusting an importer with an expensive vehicle and a large payment, and not hearing anything once it ships. Security reading: customers will not hand over phone numbers and VINs, or trust a tracking page, if details leak or someone else can see their car."
      habit: "Calling or WhatsApping the team, or an agent they know, and waiting for a reply."
    existing_assets: ["Approved Project Gate package (.opskeep/project-gate)", "Logo and homepage mockup", "Homepage and About Us copy", "Namecheap cPanel hosting with MySQL and AutoSSL", "Public GitHub repo princedevcay/atlantic-auto"]
    bet:
      belief: "customers will use simple online forms and a private tracking link if they are quicker than calling and do not expose their details"
      wager: "several weeks of build effort on existing shared hosting, with no new paid security services"
      expected_outcome: "more import quote requests captured and vehicle update requests that arrive complete and get answered faster, without a data leak"
      leading_indicator: "quote requests per week, share of update requests with a VIN or reference, and zero unauthorised tracking page views"
    outcomes:
      - "More import quote requests are captured"
      - "Vehicle update requests arrive complete and are answered faster"
      - "Customers can see their own vehicle's stage, and nobody else's"
      - "Staff accounts and customer data stay out of attackers' hands"
    rejected_options:
      - {option: "Customer login accounts for tracking", reason: "Occasional users would forget passwords and it adds account recovery risk; private links plus reference and phone check give enough protection for stage-level data"}
      - {option: "Tracking lookup by VIN alone", reason: "VINs are printed on cars and auction listings, so anyone could view another customer's shipment"}
      - {option: "Plain FTP deploys", reason: "Sends the FTP password in clear text; FTPS is required"}
      - {option: "Tailwind Play CDN in production", reason: "Third-party runtime script, weaker CSP and heavier pages; Tailwind is compiled in CI instead"}
      - {option: "Direction C The Crossing (project gate)", reason: "Heaviest on slow phone connections for a site whose job is short forms"}
  regulatory_context:
    - regime: "Ghana Data Protection Act, 2012 (Act 843)"
      status: "NOT_ASSESSED"
      notes: "Site collects names, phone numbers, emails and VINs of people in Ghana. Owner to confirm with the client whether Data Protection Commission registration and a privacy notice are required before launch (DEC-008). This baseline does not give legal advice."
    - regime: "PCI DSS"
      status: "NOT_APPLICABLE"
      notes: "No card or payment data is collected, stored or transmitted; payments happen offline (project gate AS-05). Adding payments is a material change."
    - regime: "Client service agreement with Atlantic Auto"
      status: "NOT_ASSESSED"
      notes: "Confirm any confidentiality, data handling or hosting terms in the client agreement."
    - regime: "Carrier or tracking provider API terms"
      status: "NOT_ASSESSED"
      notes: "Provider not chosen yet (DEC-005); review terms on data use and display before integration."
risk:
  tier: "MEDIUM"
  mode: "STANDARD"
  rationale:
    - "Staff authentication and an internet-facing admin area"
    - "Customer personal data (names, phones, emails) and vehicle identifiers (VINs)"
    - "Customer-facing tracking pages that must not reveal another customer's shipment"
    - "Third-party carrier API, email delivery and file uploads by staff"
    - "No payments, no AI or agents, no multi-tenant SaaS, so not HIGH"
  likely_production_tier: "MEDIUM"
  assurance:
    asvs_level: "L2"
    slsa_build_level: 1
    slsa_source_level: 2
lifecycle:
  status: "APPROVED"
  production_posture: "ELIGIBLE_WHEN_APPROVED"
  spike_expires_at: null
  development_lock: "UNLOCKED"
  deployment_lock: "UNLOCKED"
classification_levels: [PUBLIC, INTERNAL, CONFIDENTIAL, SENSITIVE, RESTRICTED]
assets:
  - id: "AST-001"
    name: "Enquiries (import quote and vehicle update requests): name, phone, email, vehicle details, VIN or reference, notes"
    classification: "CONFIDENTIAL"
    owner: "client owner (Atlantic Auto)"
    retention: "Proposed 12 months after last activity unless converted to a shipment (DEC-004)"
  - id: "AST-002"
    name: "Shipments: customer contact, vehicle, VIN, stages, notes, photos, carrier references"
    classification: "CONFIDENTIAL"
    owner: "client owner (Atlantic Auto)"
    retention: "Proposed: tracking link disabled 90 days after Delivered; record kept per owner's business records duty (DEC-004)"
  - id: "AST-003"
    name: "Staff accounts: email, password hash, TOTP secret, role"
    classification: "RESTRICTED"
    owner: "developer (PrinceCaleb.dev)"
    retention: "Until the staff member leaves; disabled immediately on exit"
  - id: "AST-004"
    name: "Secrets: database password, SMTP password, carrier API key, FTP deploy credentials"
    classification: "RESTRICTED"
    owner: "developer (PrinceCaleb.dev)"
    retention: "Rotated on staff change, suspected exposure, or yearly"
  - id: "AST-005"
    name: "Tracking access tokens and reference numbers"
    classification: "CONFIDENTIAL"
    owner: "developer (PrinceCaleb.dev)"
    retention: "Token hash kept with the shipment; revoked when the link is disabled"
  - id: "AST-006"
    name: "Public site content, images and source code"
    classification: "PUBLIC"
    owner: "developer (PrinceCaleb.dev)"
    retention: "Versioned in the public repo"
  - id: "AST-008"
    name: "Car listings for sale: specs, price, status, photos, featured and published flags"
    classification: "PUBLIC"
    owner: "client owner (Atlantic Auto)"
    retention: "Until staff delete the listing; hidden listings are INTERNAL until published"
  - id: "AST-007"
    name: "Audit and security logs (logins, admin actions, rate-limit hits)"
    classification: "INTERNAL"
    owner: "developer (PrinceCaleb.dev)"
    retention: "12 months"
components:
  - id: "CMP-001"
    name: "Public PHP website (pages, quote form, update form, track lookup, tracking pages)"
    exposure: "INTERNET"
    provider: "Namecheap cPanel shared hosting"
  - id: "CMP-002"
    name: "Staff admin (/admin): inbox, shipments, uploads, staff management"
    exposure: "INTERNET"
    provider: "Namecheap cPanel shared hosting"
  - id: "CMP-003"
    name: "MySQL database"
    exposure: "PRIVATE"
    provider: "Namecheap cPanel MySQL (localhost only)"
  - id: "CMP-004"
    name: "Outbound email (notifications to the shared inbox)"
    exposure: "THIRD_PARTY"
    provider: "cPanel mail over authenticated SMTP with TLS"
  - id: "CMP-005"
    name: "Carrier sync job (cron) calling the carrier or container-tracking API"
    exposure: "INTERNAL"
    provider: "cPanel cron + PHP CLI"
  - id: "CMP-006"
    name: "Carrier or container-tracking API"
    exposure: "THIRD_PARTY"
    provider: "Not chosen yet (DEC-005)"
  - id: "CMP-007"
    name: "Source repo and CI/CD (GitHub, GitHub Actions, FTPS deploy)"
    exposure: "THIRD_PARTY"
    provider: "GitHub (public repo princedevcay/atlantic-auto)"
  - id: "CMP-008"
    name: "Uploaded shipment photos (stored outside the web root, served by a PHP handler)"
    exposure: "PRIVATE"
    provider: "Namecheap cPanel file system"
trust_boundaries:
  - id: "TB-001"
    name: "Internet to public site"
    from: "PUBLIC_INTERNET"
    to: ["CMP-001"]
  - id: "TB-002"
    name: "Internet to staff admin"
    from: "PUBLIC_INTERNET"
    to: ["CMP-002"]
  - id: "TB-003"
    name: "Application to database and file storage"
    from: "CMP-001"
    to: ["CMP-003", "CMP-008"]
  - id: "TB-004"
    name: "Application to third-party services"
    from: "CMP-005"
    to: ["CMP-004", "CMP-006"]
  - id: "TB-005"
    name: "CI/CD to hosting"
    from: "CMP-007"
    to: ["CMP-001", "CMP-002"]
data_flows:
  - id: "FLW-001"
    name: "Submit import quote request"
    origin: "Website visitor"
    processing: "CSRF and honeypot check, rate limit, server-side validation, store in MySQL with a reference number"
    destination: "MySQL enquiries table; notification email to the shared inbox"
    classification: "CONFIDENTIAL"
    retention: "See AST-001"
    boundaries: ["TB-001", "TB-003", "TB-004"]
  - id: "FLW-002"
    name: "Submit vehicle update request"
    origin: "Existing customer"
    processing: "Same checks as FLW-001; never confirms whether a VIN or reference exists"
    destination: "MySQL enquiries table; notification email to the shared inbox"
    classification: "CONFIDENTIAL"
    retention: "See AST-001"
    boundaries: ["TB-001", "TB-003", "TB-004"]
  - id: "FLW-003"
    name: "View tracking page"
    origin: "Customer with a private link, or reference plus last 4 phone digits"
    processing: "Token or reference check with rate limits; render minimal shipment view"
    destination: "Customer browser"
    classification: "CONFIDENTIAL"
    retention: "Not stored client-side; page sent with no-store cache headers"
    boundaries: ["TB-001", "TB-003"]
  - id: "FLW-004"
    name: "Staff manage enquiries and shipments"
    origin: "Signed-in staff"
    processing: "Role check per action, CSRF check, audit log entry"
    destination: "MySQL; photo storage"
    classification: "CONFIDENTIAL"
    retention: "See AST-002"
    boundaries: ["TB-002", "TB-003"]
  - id: "FLW-005"
    name: "Carrier sync"
    origin: "Cron job"
    processing: "Fetch events for active shipments from the allow-listed carrier API host; validate and store as plain text"
    destination: "MySQL carrier_events table"
    classification: "INTERNAL"
    retention: "Kept with the shipment"
    boundaries: ["TB-004", "TB-003"]
  - id: "FLW-007"
    name: "Browse cars for sale"
    origin: "Website visitor"
    processing: "List and show only published cars and their photos"
    destination: "Visitor browser"
    classification: "PUBLIC"
    retention: "Cacheable public pages and images"
    boundaries: ["TB-001", "TB-003"]
  - id: "FLW-008"
    name: "Car enquiry"
    origin: "Website visitor on an available car"
    processing: "Same checks as FLW-001; linked to the car"
    destination: "MySQL enquiries table; [Car Enquiry] email to the shared inbox"
    classification: "CONFIDENTIAL"
    retention: "See AST-001"
    boundaries: ["TB-001", "TB-003", "TB-004"]
  - id: "FLW-006"
    name: "Deploy"
    origin: "GitHub Actions on main after owner approval"
    processing: "Build Tailwind CSS, composer install --no-dev, run checks, upload over FTPS"
    destination: "Hosting application directory"
    classification: "PUBLIC"
    retention: "Release artifacts kept 90 days in GitHub Actions"
    boundaries: ["TB-005"]
identities:
  - id: "ID-001"
    name: "Admin (Atlantic owner or manager)"
    type: "HUMAN"
    authentication: "Email + password (Argon2id or bcrypt hash) + TOTP MFA"
    resources: ["CMP-002", "CMP-003", "CMP-008"]
    permissions: ["all Staff permissions", "create, disable and reset staff accounts", "delete enquiries, shipments and car listings", "export data"]
    forbidden_actions: ["read secrets or server configuration", "deploy code"]
    human_approval: "Deleting a shipment or disabling a staff account needs a typed confirmation"
  - id: "ID-002"
    name: "Staff"
    type: "HUMAN"
    authentication: "Email + password + TOTP MFA"
    resources: ["CMP-002", "CMP-003", "CMP-008"]
    permissions: ["read and update enquiries", "create and update shipments and stages", "upload photos", "copy tracking links (when customer tracking is on)", "create and edit car listings, prices, status, featured flag and photos", "publish or hide car listings"]
    forbidden_actions: ["manage staff accounts", "delete records or car listings", "export all data", "change carrier settings"]
    human_approval: "None beyond their own session"
  - id: "ID-003"
    name: "Customer (tracking viewer)"
    type: "HUMAN"
    authentication: "Possession of a private link token, or reference plus last 4 phone digits; no account"
    resources: ["CMP-001"]
    permissions: ["view their own shipment's tracking page (only when customer tracking is on)", "view published cars for sale", "submit forms, including car enquiries"]
    forbidden_actions: ["view any other shipment", "see full phone, email, price or internal notes"]
    human_approval: "None"
  - id: "ID-004"
    name: "Deploy workflow (GitHub Actions)"
    type: "WORKLOAD"
    authentication: "Dedicated cPanel FTP account limited to the application directory; credentials in GitHub Actions environment secrets"
    resources: ["CMP-001", "CMP-002"]
    permissions: ["upload application files to the app directory"]
    forbidden_actions: ["read or overwrite config.php", "touch the uploads or backups directories", "access the database", "access other sites on the account"]
    human_approval: "GitHub production environment requires owner approval before each deploy"
  - id: "ID-005"
    name: "Carrier sync job"
    type: "WORKLOAD"
    authentication: "Carrier API key from config.php; MySQL user with least privilege"
    resources: ["CMP-003", "CMP-006"]
    permissions: ["read active shipment carrier references", "insert carrier events"]
    forbidden_actions: ["change stages set by staff", "read staff accounts", "call any host outside the allow-list"]
    human_approval: "None"
  - id: "ID-006"
    name: "Developer (PrinceCaleb.dev)"
    type: "HUMAN"
    authentication: "GitHub account with 2FA; cPanel login with 2FA"
    resources: ["CMP-007", "CMP-001", "CMP-002", "CMP-003"]
    permissions: ["merge to main", "approve production deploys", "manage cPanel, database and secrets"]
    forbidden_actions: ["commit secrets", "use production customer data in development"]
    human_approval: "Owner of the baseline approval"
